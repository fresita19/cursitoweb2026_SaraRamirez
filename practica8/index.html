<!DOCTYPE html>
<html lang="es">
    <meta charset="UFT-8">
    <meta name="viewport" content="width=device-wiht, initial-scale=1.0">
    <title>Facebook - Iniciar sesión o registrarse</title>
    <link rel="stylessheet" href="./styles/styles.css">
    <head>
        <body>
            <main class="main-contairner">
                <div class="content-wrapper">

                    <section class="brand-section">
                        <h1 class="facebook-logo">facebook</h1>
                        <p class="brand-tagline">
                            Facebook te ayuda a comunicarte y compartir con las personas que forman parte de tu vida
                        </p>
                    </section>

                    <section class="login-section">
                        <div class="login-card">
                            <form id="login-form">
                                <div class="input-group">
                                    <input
                                    tipe="text"
                                    id="email"
                                    placeholder="Correo electronico o numero de telefono"
                                    required>
                                </div>
                                <div class="input-group">
                                 <input
                                type="password"
                                id="password"
                                placeholder="Contraseña"
                                required>
                                </div>
                                <button tipe="submit" class="btn-login">Iniciar sesión</button>
                            </form>
                            <div class="forgot-password">
                                <a href="#">Olvidaste tu contraseña</a>
                            </div>
                            <div class="divider"></div>
                            <div class="create-account-container">
                                <button type="button" class=""
                            </div>
                        </div>
                    </section>
                </div>
            </main>
        </body>
    </head>
</html>

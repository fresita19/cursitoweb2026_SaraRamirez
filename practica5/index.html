<!DOCTYPE html>
<html>
    <meta charset="UFT-8">
    <title>Mi primer contador</title>
    <style>
        body{
            text-align: center;
            font-family: Arial;
            margin-top: 50px;
        }
        h1 {
            font-size: 80px;
            color: darkseagreen;
            margin: 10px;
        }
        button {
            font-size: 20px;
            padding: 10px;
            cursor: pointer;
        }
    </style>
    <head>
        <body>
            <h2>Haz clic para contar!</h2>
            <h1 id="numero">10000</h1>
            <button onclick="sumar ()">Contar 10000</button>
            <!--Promagación-->
            <script>
                let contador = 0;
                function sumar() {
                    contador = contador + 10000;
                    document.getElementById('numero').textContent = contador;
                }
            </script>
        </body>
    </head>
</html>
